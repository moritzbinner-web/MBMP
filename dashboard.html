<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBMP — Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
/* =====================================================
   MBMP DASHBOARD — Gold Apple Minimalism
   No glass. Pure form. Maximum restraint.
   ===================================================== */
:root {
  --black:   #0a0906;
  --bg:      #0c0b08;
  --bg2:     #111009;
  --bg3:     #161410;
  --line:    rgba(201,168,76,0.12);
  --line2:   rgba(201,168,76,0.22);
  --line3:   rgba(201,168,76,0.4);
  --text:    #ede7d9;
  --text2:   rgba(237,231,217,0.55);
  --text3:   rgba(237,231,217,0.28);
  --gold:    #c9a84c;
  --gold2:   #e8c97a;
  --gold3:   #f5e4aa;
  --gold-bg: rgba(201,168,76,0.07);
  --green:   #6abf8a;
  --green-bg: rgba(106,191,138,0.08);
  --orange:  #c9864c;
  --orange-bg: rgba(201,134,76,0.08);
  --red:     #bf6a6a;
  --red-bg:  rgba(191,106,106,0.08);
  --nav-w:   232px;
  --top-h:   60px;
  --ff: 'Cormorant Garamond', Georgia, serif;
  --fb: 'DM Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); font-weight: 300; min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 2px; } ::-webkit-scrollbar-thumb { background: var(--gold); opacity: 0.3; }
img, video { display: block; max-width: 100%; }
button { font-family: var(--fb); cursor: pointer; }
input, textarea, select { font-family: var(--fb); }
a { color: inherit; text-decoration: none; }

/* ── SCREENS ── */
.screen { display: none; width: 100%; min-height: 100vh; }
.screen.active { display: flex; }

/* =====================================================
   LOGIN
   ===================================================== */
#screen-login {
  align-items: center; justify-content: center;
  background: var(--black); flex-direction: column;
  position: relative; overflow: hidden;
}
.login-grid-bg {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 64px 64px;
  mask-image: radial-gradient(ellipse 60% 60% at 50% 50%, black 0%, transparent 100%);
}
.login-wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 24px; }
.login-logo-area { text-align: center; margin-bottom: 48px; }
.login-logo {
  font-family: var(--ff); font-size: 2rem; font-weight: 300; letter-spacing: 0.18em;
  color: var(--gold); text-transform: uppercase; margin-bottom: 6px;
}
.login-logo-sub { font-size: 0.68rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text3); }
.login-box {
  border: 1px solid var(--line); background: var(--bg2); padding: 40px;
}
.login-tabs { display: flex; margin-bottom: 32px; border-bottom: 1px solid var(--line); }
.ltab {
  flex: 1; padding: 10px; text-align: center; font-size: 0.72rem;
  font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text3); cursor: pointer; border-bottom: 1px solid transparent;
  margin-bottom: -1px; transition: all 0.2s;
}
.ltab.active { color: var(--gold); border-bottom-color: var(--gold); }
.fgroup { margin-bottom: 20px; }
.fgroup label { display: block; font-size: 0.65rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.finput {
  width: 100%; background: none; border: none; border-bottom: 1px solid var(--line);
  padding: 10px 0; color: var(--text); font-size: 0.88rem; font-weight: 300;
  outline: none; transition: border-color 0.2s;
}
.finput:focus { border-color: var(--gold); }
.finput::placeholder { color: var(--text3); }
.err-msg { font-size: 0.75rem; color: var(--red); margin-bottom: 14px; display: none; padding: 10px 0; border-bottom: 1px solid rgba(191,106,106,0.2); }
.btn-login {
  width: 100%; margin-top: 28px; padding: 14px; background: none;
  border: 1px solid var(--gold); color: var(--gold); font-family: var(--ff);
  font-size: 0.95rem; font-weight: 400; font-style: italic; letter-spacing: 0.06em;
  cursor: pointer; transition: all 0.25s;
}
.btn-login:hover { background: var(--gold); color: var(--black); }
.demo-row { display: flex; gap: 1px; margin-top: 28px; border-top: 1px solid var(--line); padding-top: 24px; }
.demo-btn {
  flex: 1; padding: 10px 4px; text-align: center; background: none;
  border: 1px solid var(--line); color: var(--text3); font-size: 0.7rem;
  font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s;
}
.demo-btn:hover { border-color: var(--line2); color: var(--gold2); }
.demo-btn-lbl { font-size: 0.58rem; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.06em; }

/* =====================================================
   DASHBOARD
   ===================================================== */
#screen-dashboard { flex-direction: row; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--nav-w); flex-shrink: 0; height: 100vh;
  position: fixed; top: 0; left: 0; z-index: 60;
  background: var(--black); border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
}
.sb-logo { padding: 24px 22px 20px; border-bottom: 1px solid var(--line); }
.sb-logo-name { font-family: var(--ff); font-size: 1.3rem; font-weight: 300; letter-spacing: 0.14em; color: var(--gold); text-transform: uppercase; }
.sb-logo-role { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text3); margin-top: 2px; }
.role-pill { font-size: 0.58rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; margin-top: 6px; display: inline-block; }
.rp-admin { border: 1px solid rgba(191,106,106,0.3); color: var(--red); }
.rp-employee { border: 1px solid rgba(196,181,253,0.3); color: #c4b5fd; }
.rp-client { border: 1px solid var(--line2); color: var(--gold); }
.sb-nav { flex: 1; overflow-y: auto; padding: 18px 14px; }
.nav-sec { font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text3); padding: 14px 8px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 8px;
  font-size: 0.8rem; font-weight: 400; letter-spacing: 0.04em; color: var(--text2);
  cursor: pointer; transition: all 0.18s; border-left: 1px solid transparent;
  margin-bottom: 1px;
}
.nav-item:hover { color: var(--text); border-left-color: var(--line2); padding-left: 12px; }
.nav-item.active { color: var(--gold); border-left-color: var(--gold); padding-left: 12px; }
.nav-item .ni { width: 16px; text-align: center; font-size: 0.8rem; flex-shrink: 0; }
.ni-badge {
  margin-left: auto; font-size: 0.6rem; font-weight: 400; padding: 1px 6px;
  border: 1px solid rgba(201,134,76,0.3); color: var(--orange); min-width: 18px; text-align: center;
}
.ni-badge.info { border-color: var(--line2); color: var(--gold); }
.sb-user { padding: 16px 22px; border-top: 1px solid var(--line); }
.sb-user-row { display: flex; align-items: center; gap: 10px; }
.sb-av {
  width: 30px; height: 30px; border: 1px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--ff); font-size: 0.8rem; font-weight: 300; color: var(--gold); flex-shrink: 0;
}
.sb-uname { font-size: 0.8rem; font-weight: 400; }
.sb-uemail { font-size: 0.66rem; color: var(--text3); }
.sb-out { margin-left: auto; font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); cursor: pointer; padding: 4px 8px; border: 1px solid transparent; transition: all 0.2s; }
.sb-out:hover { color: var(--red); border-color: rgba(191,106,106,0.2); }

/* ── MAIN ── */
.main-area { margin-left: var(--nav-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  height: var(--top-h); border-bottom: 1px solid var(--line); display: flex;
  align-items: center; justify-content: space-between; padding: 0 28px;
  position: sticky; top: 0; z-index: 50; background: var(--bg);
}
.topbar-title { font-family: var(--ff); font-size: 1rem; font-weight: 300; letter-spacing: 0.06em; color: var(--gold); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.page-content { padding: 28px; flex: 1; }
.page-view { display: none; }
.page-view.active { display: block; animation: pageIn 0.25s ease; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── BUTTONS ── */
.btn {
  font-family: var(--fb); font-size: 0.72rem; font-weight: 400; letter-spacing: 0.08em;
  text-transform: uppercase; padding: 8px 18px; cursor: pointer; transition: all 0.2s;
  border: none; display: inline-flex; align-items: center; gap: 6px;
}
.btn-gold { border: 1px solid var(--gold); color: var(--gold); background: none; }
.btn-gold:hover { background: var(--gold); color: var(--black); }
.btn-fill { background: var(--gold); color: var(--black); border: 1px solid var(--gold); }
.btn-fill:hover { background: var(--gold2); border-color: var(--gold2); }
.btn-line { border: 1px solid var(--line2); color: var(--text2); background: none; }
.btn-line:hover { border-color: var(--line3); color: var(--text); }
.btn-green-s { border: 1px solid rgba(106,191,138,0.3); color: var(--green); background: none; }
.btn-green-s:hover { background: var(--green-bg); }
.btn-red-s { border: 1px solid rgba(191,106,106,0.3); color: var(--red); background: none; }
.btn-red-s:hover { background: var(--red-bg); }
.btn-sm { padding: 6px 13px; font-size: 0.66rem; }
.btn-xs { padding: 4px 9px; font-size: 0.62rem; }

/* ── CARDS ── */
.card { background: var(--bg2); border: 1px solid var(--line); padding: 22px; }
.card-title { font-family: var(--ff); font-size: 0.95rem; font-weight: 300; color: var(--gold); margin-bottom: 3px; letter-spacing: 0.04em; }
.card-sub { font-size: 0.74rem; color: var(--text3); margin-bottom: 18px; letter-spacing: 0.04em; }

/* ── PILLS ── */
.pill { font-size: 0.6rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border: 1px solid transparent; white-space: nowrap; }
.pill-gold { border-color: var(--line2); color: var(--gold); }
.pill-green { border-color: rgba(106,191,138,0.3); color: var(--green); }
.pill-orange { border-color: rgba(201,134,76,0.3); color: var(--orange); }
.pill-red { border-color: rgba(191,106,106,0.3); color: var(--red); }
.pill-dim { border-color: var(--line); color: var(--text3); }

/* ── GRID ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; }
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; }
.g5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 1px; }
.gap16 { gap: 16px; }
.mb20 { margin-bottom: 20px; }
.mb28 { margin-bottom: 28px; }

/* ── STAT CARDS ── */
.stat-card { background: var(--bg2); border: 1px solid var(--line); padding: 20px 22px; }
.stat-label { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
.stat-val { font-family: var(--ff); font-size: 2rem; font-weight: 300; letter-spacing: -0.02em; line-height: 1; }
.stat-change { font-size: 0.68rem; margin-top: 6px; display: flex; align-items: center; gap: 4px; }
.up { color: var(--green); }
.down { color: var(--red); }
.neutral { color: var(--text3); }
.c-gold { color: var(--gold); }
.c-green { color: var(--green); }
.c-orange { color: var(--orange); }
.c-red { color: var(--red); }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); font-weight: 400; }
.data-table td { padding: 11px 14px; font-size: 0.8rem; border-bottom: 1px solid rgba(201,168,76,0.05); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: var(--gold-bg); }

/* ── PROGRESS BAR ── */
.prog { background: rgba(201,168,76,0.08); height: 2px; }
.prog-fill { height: 100%; background: var(--gold); }
.prog-fill-green { background: var(--green); }

/* ── FORM ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.fg { display: flex; flex-direction: column; gap: 8px; }
.fg.full { grid-column: 1/-1; }
.fg label { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); }
.fi {
  background: none; border: none; border-bottom: 1px solid var(--line);
  padding: 10px 0; color: var(--text); font-size: 0.84rem; font-weight: 300; outline: none; width: 100%;
  transition: border-color 0.2s;
}
.fi:focus { border-color: var(--gold); }
.fi::placeholder { color: var(--text3); }
.fi option { background: #111009; }
textarea.fi { min-height: 80px; resize: vertical; border: 1px solid var(--line); padding: 10px; }
textarea.fi:focus { border-color: var(--gold); }

/* ── CHIPS ── */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 13px; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: 1px solid var(--line); color: var(--text3); transition: all 0.18s; }
.chip:hover { border-color: var(--line2); color: var(--text); }
.chip.on { border-color: var(--gold); color: var(--gold); }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(10,9,6,0.88); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--bg2); border: 1px solid var(--line2); padding: 36px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; animation: modalIn 0.22s ease; }
.modal.wide { max-width: 780px; }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.modal-title { font-family: var(--ff); font-size: 1.2rem; font-weight: 300; color: var(--gold); letter-spacing: 0.04em; margin-bottom: 4px; }
.modal-sub { font-size: 0.74rem; color: var(--text3); margin-bottom: 24px; letter-spacing: 0.04em; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }

/* ── DELIVERABLE CARDS ── */
.del-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1px; }
.del-card { background: var(--bg2); border: 1px solid var(--line); cursor: pointer; transition: all 0.2s; }
.del-card:hover { border-color: var(--line2); }
.del-thumb { aspect-ratio: 16/9; background: var(--bg3); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; position: relative; border-bottom: 1px solid var(--line); }
.del-status-indicator { position: absolute; top: 8px; right: 8px; width: 6px; height: 6px; border-radius: 50%; }
.ind-gold { background: var(--gold); }
.ind-green { background: var(--green); }
.ind-orange { background: var(--orange); }
.del-info { padding: 12px; }
.del-name { font-size: 0.78rem; font-weight: 400; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.del-meta { font-size: 0.66rem; color: var(--text3); display: flex; justify-content: space-between; }

/* ── COMMENT THREAD ── */
.comment-thread { display: flex; flex-direction: column; gap: 10px; }
.cmt { display: flex; gap: 10px; }
.cmt-av { width: 26px; height: 26px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-family: var(--ff); font-size: 0.62rem; color: var(--gold); flex-shrink: 0; }
.cmt-body { flex: 1; border-left: 1px solid var(--line); padding-left: 12px; }
.cmt.self .cmt-body { border-left-color: var(--line2); }
.cmt-author { font-size: 0.7rem; letter-spacing: 0.06em; color: var(--gold); margin-bottom: 3px; }
.cmt-text { font-size: 0.8rem; font-weight: 300; color: var(--text2); line-height: 1.55; }
.cmt-time { font-size: 0.62rem; color: var(--text3); margin-top: 3px; }

/* ── AI OPTIONS ── */
.ai-opt { border: 1px solid var(--line); padding: 20px; cursor: pointer; transition: all 0.2s; position: relative; }
.ai-opt:hover { border-color: var(--line2); }
.ai-opt.rec { border-color: var(--line2); }
.ai-opt-rec-label { position: absolute; top: -9px; left: 18px; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 10px; background: var(--gold); color: var(--black); }
.ai-opt-name { font-family: var(--ff); font-size: 0.88rem; font-weight: 300; color: var(--text); margin-bottom: 4px; letter-spacing: 0.04em; }
.ai-opt-price { font-family: var(--ff); font-size: 1.6rem; font-weight: 300; color: var(--gold); letter-spacing: -0.02em; margin-bottom: 12px; }
.ai-opt-items { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.ai-opt-items li { font-size: 0.74rem; color: var(--text2); display: flex; align-items: flex-start; gap: 7px; }
.ai-opt-items li::before { content: '—'; color: var(--gold); flex-shrink: 0; }

/* ── BAR CHART ── */
.bar-chart { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; align-items: center; gap: 12px; }
.bar-lbl { font-size: 0.72rem; color: var(--text3); width: 72px; flex-shrink: 0; letter-spacing: 0.04em; }
.bar-track { flex: 1; height: 2px; background: var(--line); }
.bar-fill { height: 100%; background: var(--gold); transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
.bar-val { font-size: 0.72rem; color: var(--text2); width: 52px; text-align: right; flex-shrink: 0; }

/* ── TIMELINE ── */
.tl { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
.tl-item:not(:last-child)::before { content: ''; position: absolute; left: 12px; top: 26px; bottom: 0; width: 1px; background: var(--line); }
.tl-dot { width: 26px; height: 26px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 0.65rem; flex-shrink: 0; }
.tl-done { border-color: rgba(106,191,138,0.4); color: var(--green); }
.tl-active { border-color: var(--line2); color: var(--gold); }
.tl-pending { color: var(--text3); }
.tl-b { flex: 1; }
.tl-title { font-size: 0.82rem; font-weight: 400; margin-bottom: 1px; }
.tl-sub { font-size: 0.7rem; color: var(--text3); }

/* ── ACT FEED ── */
.act-feed { display: flex; flex-direction: column; gap: 0; }
.act-item { display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.act-item:last-child { border-bottom: none; }
.act-icon { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex-shrink: 0; margin-top: 6px; }
.act-text { font-size: 0.78rem; font-weight: 300; flex: 1; line-height: 1.45; }
.act-time { font-size: 0.64rem; color: var(--text3); white-space: nowrap; }

/* ── EMP CARDS ── */
.emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 1px; }
.emp-card { background: var(--bg2); border: 1px solid var(--line); padding: 20px; cursor: pointer; transition: all 0.2s; }
.emp-card:hover { border-color: var(--line2); }
.emp-av { width: 40px; height: 40px; border: 1px solid var(--line2); display: flex; align-items: center; justify-content: center; font-family: var(--ff); font-size: 0.9rem; font-weight: 300; color: var(--gold); margin-bottom: 14px; }
.emp-name { font-size: 0.84rem; font-weight: 400; margin-bottom: 2px; }
.emp-status { font-size: 0.64rem; letter-spacing: 0.06em; color: var(--text3); margin-bottom: 10px; }
.emp-roles { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; }
.emp-role-tag { font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 7px; border: 1px solid var(--line); color: var(--text3); }
.emp-stats-row { display: flex; border-top: 1px solid var(--line); padding-top: 12px; gap: 0; }
.emp-stat { flex: 1; text-align: center; }
.emp-stat:not(:last-child) { border-right: 1px solid var(--line); }
.emp-stat-val { font-family: var(--ff); font-size: 1.1rem; font-weight: 300; color: var(--gold); }
.emp-stat-lbl { font-size: 0.58rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); margin-top: 1px; }

/* ── CONTRACT ITEM ── */
.contract-item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--bg2); border: 1px solid var(--line); cursor: pointer; transition: all 0.2s; }
.contract-item:hover { border-color: var(--line2); }
.ci-icon { width: 36px; height: 36px; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }

/* ── METRIC ── */
.metric-card { background: var(--bg2); border: 1px solid var(--line); padding: 18px; }
.metric-platform { font-size: 0.62rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text3); margin-bottom: 8px; display: flex; align-items: center; gap: 7px; }
.metric-num { font-family: var(--ff); font-size: 1.7rem; font-weight: 300; color: var(--gold); letter-spacing: -0.02em; }
.metric-change { font-size: 0.7rem; margin-top: 4px; }
.live-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: pulse 2.5s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

/* ── WELCOME BANNER ── */
.welcome-banner { background: var(--bg3); border: 1px solid var(--line); padding: 24px 28px; margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wb-eyebrow { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold); margin-bottom: 6px; }
.wb-title { font-family: var(--ff); font-size: 1.2rem; font-weight: 300; color: var(--text); }
.wb-sub { font-size: 0.76rem; color: var(--text3); margin-top: 3px; }

/* ── TOAST ── */
#toast-c { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 6px; pointer-events: none; }
.toast { background: var(--bg2); border: 1px solid var(--line2); padding: 14px 18px; min-width: 260px; pointer-events: auto; animation: toastIn 0.25s ease; display: flex; gap: 10px; align-items: flex-start; }
@keyframes toastIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
.t-icon { font-size: 0.75rem; color: var(--gold); flex-shrink: 0; margin-top: 2px; }
.t-title { font-size: 0.78rem; font-weight: 400; margin-bottom: 1px; }
.t-msg { font-size: 0.7rem; color: var(--text3); }

/* ── SPINNER ── */
.spinner { width: 16px; height: 16px; border: 1px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-row { display: flex; align-items: center; gap: 10px; color: var(--text3); font-size: 0.8rem; padding: 16px 0; }

/* ── BACK LINK ── */
.back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); margin-bottom: 20px; cursor: pointer; transition: color 0.2s; }
.back-link:hover { color: var(--gold); }
.back-link::before { content: '←'; }

/* ── SIDEBAR TOGGLE BUTTON ── */
.sb-toggle {
  width: 32px; height: 32px; border: 1px solid var(--line);
  background: none; cursor: pointer; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.2s; color: var(--text3); font-size: 1rem; line-height: 1;
}
.sb-toggle:hover { border-color: var(--line2); color: var(--gold); }

/* ── COLLAPSED SIDEBAR (icon-only, desktop) ── */
.sidebar.collapsed { width: 52px; }
.sidebar.collapsed .sb-logo { padding: 16px 10px; display: flex; justify-content: center; align-items: center; }
.sidebar.collapsed .sb-logo-name { display: none; }
.sidebar.collapsed .sb-logo-role { display: none; }
.sidebar.collapsed #sb-role-pill { display: none; }
.sidebar.collapsed .nav-sec { display: none; }
.sidebar.collapsed .nav-item { padding: 10px; justify-content: center; border-left: 1px solid transparent; }
.sidebar.collapsed .nav-item .nav-item-label { display: none; }
.sidebar.collapsed .ni-badge { display: none; }
.sidebar.collapsed .nav-item.active { background: var(--gold-bg); border-left-color: var(--gold); }
.sidebar.collapsed .sb-user { padding: 12px 10px; }
.sidebar.collapsed .sb-uname,
.sidebar.collapsed .sb-uemail,
.sidebar.collapsed .sb-out { display: none; }
.sidebar.collapsed .sb-user-row { justify-content: center; }
.sidebar.collapsed ~ .main-area { margin-left: 52px; }

/* ── MOBILE BACKDROP ── */
.sb-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(9,8,5,0.72);
  z-index: 55;
}
.sb-backdrop.visible { display: block; }

/* ══ RESPONSIVE MOBILE ══ */
@media (max-width: 768px) {
  html, body { overflow-x: hidden; }

  /* LOGIN */
  .login-wrap { padding: 16px; }
  .login-box { padding: 24px 18px; }

  /* SIDEBAR: off-canvas slide-in */
  .sidebar {
    width: 220px !important;
    transform: translateX(-100%);
    transition: transform 0.28s cubic-bezier(0.16,1,0.3,1);
    z-index: 70;
  }
  .sidebar.mobile-open { transform: translateX(0) !important; }
  /* Reset collapsed overrides on mobile */
  .sidebar.collapsed .sb-logo { padding: 20px 18px; display: block; }
  .sidebar.collapsed .sb-logo-name { display: block; }
  .sidebar.collapsed .sb-logo-role { display: block; }
  .sidebar.collapsed #sb-role-pill { display: inline-block; }
  .sidebar.collapsed .nav-sec { display: block; }
  .sidebar.collapsed .nav-item { padding: 9px 8px; justify-content: flex-start; }
  .sidebar.collapsed .nav-item .nav-item-label { display: inline; }
  .sidebar.collapsed .ni-badge { display: inline; }
  .sidebar.collapsed .sb-user { padding: 16px 20px; }
  .sidebar.collapsed .sb-uname,
  .sidebar.collapsed .sb-uemail,
  .sidebar.collapsed .sb-out { display: block; }
  .sidebar.collapsed .sb-user-row { justify-content: flex-start; }

  /* MAIN — always full width on mobile */
  .main-area { margin-left: 0 !important; width: 100%; }

  /* TOPBAR */
  .topbar { padding: 0 14px; gap: 8px; }
  .topbar-title { font-size: 0.84rem; }
  .topbar-right a, .topbar-right button { display: none; }
  .topbar-right .keep-mobile { display: inline-flex !important; }

  /* PAGE CONTENT */
  .page-content { padding: 14px; overflow-x: hidden; }

  /* GRIDS */
  .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .g5 { grid-template-columns: 1fr 1fr; }

  /* TABLES */
  .card { overflow-x: auto; padding: 14px; }
  .data-table { min-width: 480px; }

  /* FORMS */
  .form-grid { grid-template-columns: 1fr; }
  .fg.full { grid-column: 1; }

  /* DELIVERABLES */
  .del-grid { grid-template-columns: 1fr 1fr; }

  /* EMPLOYEES */
  .emp-grid { grid-template-columns: 1fr 1fr; }

  /* WELCOME BANNER */
  .welcome-banner { flex-direction: column; align-items: flex-start; gap: 12px; }

  /* MODAL */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal, .modal.wide {
    max-width: 100%; border-radius: 0;
    padding: 22px 16px; max-height: 92vh;
  }

  /* AI options 3-col → 1-col */
  .g3 { grid-template-columns: 1fr; }

  /* MESSAGES chat layout */
  #messages-layout { grid-template-columns: 1fr !important; }
}

  if (!match) { err.style.display = 'block'; err.textContent = 'Ungültige Zugangsdaten.'; return; }
  S.user = match;
  initDash();
}

function openModal(type) {
  const map = {
    'new-employee': buildEmpModal,
    'new-task': buildTaskModal,
    'new-deliverable': buildDelModal,
    'new-client': buildClientModal,
  };
  if (!map[type]) return;
  document.getElementById('modal-box').className = 'modal';
  document.getElementById('modal-content').innerHTML = map[type]();
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay'))
    document.getElementById('modal-overlay').classList.remove('open');
}

// =====================================================
async function runAI() {
  const problem = document.getElementById('r-problem')?.value||'';
  const vision = document.getElementById('r-vision')?.value||'';
  const budget = document.getElementById('r-budget')?.value||'';
  const services = Array.from(document.querySelectorAll('#service-chips .chip.on')).map(c=>c.textContent.trim());
  const url = document.getElementById('r-url')?.value||'';
  if(!problem&&!vision){toast('error','Fehler','Bitte Vorhaben beschreiben.');return;}
  const loading = document.getElementById('ai-loading');
  const result = document.getElementById('ai-result');
  if(loading) loading.style.display='flex';
  if(result) result.style.display='none';
  const prompt=`Du bist Medienproduktions-Berater für die Agentur MBMP (Foto, Video, Interview, Documentary, Branding). Analysiere diese Anfrage und erstelle drei Angebotsoptionen.
Website: ${url||'k.A.'}
Services: ${services.join(', ')||'k.A.'}
Vorhaben: ${problem}
Lösungsvorstellung: ${vision||'k.A.'}
Budget: ${budget||'k.A.'}
Antworte NUR JSON (kein Markdown): {"analysis":"2-3 Sätze Analyse","options":[{"name":"Essential","price":"€ X.XXX","items":["L1","L2","L3"],"recommended":false},{"name":"Standard","price":"€ X.XXX","items":["L1","L2","L3","L4"],"recommended":true},{"name":"Premium","price":"€ X.XXX","items":["L1","L2","L3","L4","L5"],"recommended":false}]}`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const data = await res.json();
    let txt = data.content.map(b=>b.text||'').join('').trim();
    const m = txt.match(/\{[\s\S]*\}/);
    const p = JSON.parse(m?m[0]:txt);
    if(loading) loading.style.display='none';
    if(result) {
      result.style.display='block';
      result.innerHTML=`
        <div style="margin-top:24px;border-top:1px solid var(--line);padding-top:22px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div style="font-family:var(--ff);font-size:0.9rem;font-weight:300;color:var(--gold)">KI-Analyse</div>
            <span class="pill pill-orange">Vorläufig — Bestätigung erforderlich</span>
          </div>
          <p style="font-size:0.8rem;color:var(--text2);line-height:1.65;margin-bottom:20px;border-left:1px solid var(--line);padding-left:14px">${p.analysis}</p>
          <div class="g3 mb20" style="gap:1px">
            ${p.options.map(opt=>`
              <div class="ai-opt ${opt.recommended?'rec':''}">
                ${opt.recommended?'<div class="ai-opt-rec-label">Empfohlen</div>':''}
                <div class="ai-opt-name">${opt.name}</div>
                <div class="ai-opt-price">${opt.price}</div>
                <ul class="ai-opt-items">${opt.items.map(i=>`<li>${i}</li>`).join('')}</ul>
              </div>`).join('')}
          </div>
          <div style="padding:11px 13px;border:1px solid var(--line);font-size:0.74rem;color:var(--text3);margin-bottom:16px">— Dieses Angebot wird erst nach Prüfung und Bestätigung durch das MBMP-Team gültig.</div>
          <button class="btn btn-fill" style="width:100%;font-family:var(--ff);font-style:italic;padding:12px" onclick="submitAI()">→ Anfrage absenden</button>
        </div>`;
    }
  } catch(e) {
    if(loading) loading.style.display='none';
    toast('error','Fehler','Analyse fehlgeschlagen.');
  }
}

function submitAI() {
  document.getElementById('ai-result').innerHTML=`
    <div style="margin-top:24px;border-top:1px solid var(--line);padding-top:28px;text-align:center">
      <div style="font-family:var(--ff);font-size:2rem;color:var(--gold);margin-bottom:12px">✓</div>
      <div style="font-family:var(--ff);font-size:1rem;font-weight:300;color:var(--gold);margin-bottom:8px">Anfrage eingereicht</div>
      <p style="font-size:0.78rem;color:var(--text3)">MBMP prüft Ihre Anfrage und meldet sich innerhalb von 24h. Bei Bestätigung erhalten Sie automatisch das offizielle Angebot und einen Vertragsentwurf.</p>
    </div>`;
  toast('success','Anfrage eingereicht','Wir melden uns innerhalb von 24h.');
}

function saveEmp() {
  const fn=document.getElementById('em-fn')?.value?.trim();
  const ln=document.getElementById('em-ln')?.value?.trim();
  const email=document.getElementById('em-email')?.value?.trim();
  const rate=parseInt(document.getElementById('em-rate')?.value)||75;
  const roles=Array.from(document.querySelectorAll('#role-chips .chip.on')).map(c=>c.textContent.trim());
  if(!fn||!roles.length){toast('error','Fehler','Name und Rolle erforderlich.');return;}
  S.employees.push({id:'e'+Date.now(),name:`${fn} ${ln}`,email:email||`${fn.toLowerCase()}@mbmp.de`,initials:(fn[0]+(ln?ln[0]:'')).toUpperCase(),roles:roles.slice(0,5),rate,tasks:0,projects:0,active:true});
  closeModal();
  nav2('employees');
  toast('success','Mitarbeiter angelegt',`${fn} ${ln} wurde hinzugefügt.`);
}

function saveTask() {
  const title=document.getElementById('nt-title')?.value?.trim();
  const empId=document.getElementById('nt-emp')?.value;
  const emp=S.employees.find(e=>e.id===empId);
  const client=document.getElementById('nt-client')?.value;
  const project=document.getElementById('nt-proj')?.value;
  const due=document.getElementById('nt-due')?.value||'—';
  const prio=document.getElementById('nt-prio')?.value||'medium';
  if(!title){toast('error','Fehler','Titel erforderlich.');return;}
  S.tasks.push({id:'t'+Date.now(),title,employee:emp?.name||'—',project,priority:prio,due,status:'open',client});
  if(emp) emp.tasks++;
  closeModal();
  nav2('tasks-admin');
  toast('success','Aufgabe zugewiesen',`"${title}" wurde zugewiesen.`);
}

function saveDel() {
  const name=document.getElementById('nd-name')?.value?.trim();
  const client=document.getElementById('nd-client')?.value;
  const type=document.getElementById('nd-type')?.value||'video';
  const project=document.getElementById('nd-proj')?.value;
  const url=document.getElementById('nd-url')?.value||'#';
  const status=document.getElementById('nd-status')?.value||'draft';
  const version=parseInt(document.getElementById('nd-ver')?.value)||1;
  const comment=document.getElementById('nd-comment')?.value?.trim();
  if(!name){toast('error','Fehler','Dateiname erforderlich.');return;}
  const em={video:'▶',photo:'◉',graphic:'◈',web:'◎',doc:'—'};
  S.deliverables.push({id:'d'+Date.now(),name,type,emoji:em[type]||'—',project,client,url,date:new Date().toLocaleDateString('de-DE',{day:'numeric',month:'short',year:'numeric'}),status,version,comments:comment?[{author:S.user?.name||'Admin',text:comment,time:'Soeben',self:true}]:[]});
  closeModal();
  nav2('deliverables-admin');
  toast('success','Deliverable hinzugefügt',`"${name}" für ${client}.`);
}

function saveClient() {
  const name=document.getElementById('nc-name')?.value?.trim();

  const co=document.getElementById('nc-co')?.value?.trim();

function addCmt(delId) {
  const d=S.deliverables.find(x=>x.id===delId);
  const input=document.getElementById(`new-cmt-${delId}`);
  if(!d||!input?.value?.trim()) return;
  const c={author:S.user?.name||'User',text:input.value.trim(),time:'Soeben',self:S.user?.role!=='client'};
  d.comments.push(c);
  const thread=document.getElementById(`cmt-thread-${delId}`);
  if(thread){
    const div=document.createElement('div');
    div.className=`cmt ${c.self?'self':''}`;
    div.innerHTML=`<div class="cmt-av">${c.author.split(' ').map(n=>n[0]).join('').slice(0,2)}</div><div class="cmt-body"><div class="cmt-author">${c.author}</div><div class="cmt-text">${c.text}</div><div class="cmt-time">${c.time}</div></div>`;
    thread.appendChild(div);
    thread.scrollTop=thread.scrollHeight;
  }
  input.value='';
  toast('success','Kommentar gespeichert','');
}

function markDone(id) {
  const t=S.tasks.find(x=>x.id===id);
  if(t) t.status='done';
  nav2('my-tasks');
  toast('success','Erledigt',`"${t?.title}" abgeschlossen.`);
}

function loadChat(name) {
  const area=document.getElementById('chat-area');
  if(area) area.innerHTML=buildChatView(name);
}

function sendMsg(name) {
  const input=document.getElementById('chat-input');
  if(!input?.value?.trim()) return;
  if(!S.messages[name]) S.messages[name]=[];
  S.messages[name].push({from:S.user?.name||'User',text:input.value.trim(),time:'Gerade eben',self:true});
  loadChat(name);
}

function toggleRole(el) {
  const sel=document.querySelectorAll('#role-chips .chip.on').length;
  if(!el.classList.contains('on')&&sel>=5){toast('info','Max. 5 Rollen','');return;}
  el.classList.toggle('on');
}

function filterDels(btn,type) {
  document.querySelectorAll('#del-client-grid .del-card').forEach(c=>{c.style.display=(type==='all'||c.dataset.type===type)?'block':'none';});
  btn.closest('.page-view').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  btn.classList.add('on');
}

function pOfferStatus(s){const m={pending:`<span class="pill pill-orange">Ausstehend</span>`,confirmed:`<span class="pill pill-green">Bestätigt</span>`,rejected:`<span class="pill pill-dim">Abgelehnt</span>`};return m[s]||`<span class="pill pill-dim">${s}</span>`;}
function pClientStatus(s){const m={active:`<span class="pill pill-green">Aktiv</span>`,done:`<span class="pill pill-gold">Abgeschlossen</span>`,negotiation:`<span class="pill pill-orange">Verhandlung</span>`,new:`<span class="pill pill-dim">Neu</span>`};return m[s]||`<span class="pill pill-dim">${s}</span>`;}
function pPriority(p){const m={high:`<span class="pill pill-red">Hoch</span>`,medium:`<span class="pill pill-orange">Mittel</span>`,low:`<span class="pill pill-green">Niedrig</span>`};return m[p]||`<span class="pill pill-dim">${p}</span>`;}
function pTaskStatus(s){const m={'in-progress':`<span class="pill pill-gold">In Arbeit</span>`,open:`<span class="pill pill-orange">Offen</span>`,done:`<span class="pill pill-green">Erledigt</span>`};return m[s]||`<span class="pill pill-dim">${s}</span>`;}
function pDelStatus(s){const m={draft:`<span class="pill pill-dim">Entwurf</span>`,review:`<span class="pill pill-orange">Review</span>`,delivered:`<span class="pill pill-gold">Übergeben</span>`,live:`<span class="pill pill-green">Live</span>`};return m[s]||`<span class="pill pill-dim">${s}</span>`;}
function delPill(t){const m={video:'pill-gold',photo:'pill-green',graphic:'pill-orange',web:'pill-dim'};return m[t]||'pill-dim';}

function toast(type,title,msg) {
  const icons={success:'✓',error:'✕',info:'—'};
  const t=document.createElement('div');
  t.className='toast';
  t.innerHTML=`<div class="t-icon">${icons[type]}</div><div><div class="t-title">${title}</div>${msg?`<div class="t-msg">${msg}</div>`:''}</div>`;
  document.getElementById('toast-c').appendChild(t);
  setTimeout(()=>t.style.opacity='0',3500);
  setTimeout(()=>t.remove(),4000);
  t.style.transition='opacity 0.5s';
}

// =====================================================
// SIDEBAR TOGGLE (desktop collapse + mobile open)
// =====================================================
let sidebarCollapsed = false;

function toggleSidebar() {
  const sb = document.getElementById('sidebar');
  const isMobile = window.innerWidth <= 768;
  if (isMobile) {
    const isOpen = sb.classList.contains('mobile-open');
    if (isOpen) {
      closeSidebarMobile();
    } else {
      sb.classList.add('mobile-open');
      document.getElementById('sb-backdrop').classList.add('visible');
    }
  } else {
    sidebarCollapsed = !sidebarCollapsed;
    sb.classList.toggle('collapsed', sidebarCollapsed);
    document.getElementById('sb-toggle-btn').textContent = sidebarCollapsed ? '▷' : '☰';
  }
}

function closeSidebarMobile() {
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('sb-backdrop').classList.remove('visible');
}

// Show/hide topbar hamburger based on screen size
function handleResize() {
  const btn = document.getElementById('topbar-hamburger');
  if (!btn) return;
  if (window.innerWidth <= 768) {
    btn.style.display = 'flex';
    // Hide sidebar toggle in header on mobile to avoid double
    const sbBtn = document.getElementById('sb-toggle-btn');
    if (sbBtn) sbBtn.style.display = 'none';
  } else {
    btn.style.display = 'none';
    const sbBtn = document.getElementById('sb-toggle-btn');
    if (sbBtn) sbBtn.style.display = 'flex';
    // Close mobile drawer if resized to desktop
    document.getElementById('sidebar').classList.remove('mobile-open');
    document.getElementById('sb-backdrop').classList.remove('visible');
  }
}
window.addEventListener('resize', handleResize);
window.addEventListener('DOMContentLoaded', handleResize);
</script>
