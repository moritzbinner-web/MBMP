<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YourBrand – Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN SYSTEM – Glass iOS/macOS · Dark · Glowing
   ============================================================ */
:root {
  --bg: #07090f;
  --bg2: #0b0e17;
  --bg3: #0f1220;
  --glass: rgba(255,255,255,0.035);
  --glass2: rgba(255,255,255,0.06);
  --glass3: rgba(255,255,255,0.09);
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --border3: rgba(255,255,255,0.22);
  --text: #eef0f7;
  --text2: rgba(238,240,247,0.6);
  --text3: rgba(238,240,247,0.35);
  --accent: #b8e4ff;
  --accent2: #6ab4d8;
  --accent-glow: rgba(107,184,255,0.2);
  --green: #5fffc0;
  --green-g: rgba(95,255,192,0.15);
  --orange: #ffb347;
  --orange-g: rgba(255,179,71,0.15);
  --red: #ff6b7a;
  --red-g: rgba(255,107,122,0.15);
  --purple: #c4b5fd;
  --purple-g: rgba(196,181,253,0.15);
  --gold: #ffd166;
  --nav-w: 248px;
  --top-h: 60px;
  --r: 18px;
  --r2: 12px;
  --r3: 8px;
  --ff: 'Syne', sans-serif;
  --fb: 'DM Sans', sans-serif;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow2: 0 20px 60px rgba(0,0,0,0.6);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body { background: var(--bg); color: var(--text); font-family: var(--fb); min-height: 100vh; overflow-x: hidden; }
::-webkit-scrollbar { width: 3px; } ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
img, video { display: block; max-width: 100%; }
button { font-family: var(--fb); cursor: pointer; }
input, textarea, select { font-family: var(--fb); }
a { color: inherit; text-decoration: none; }

/* ── SCREENS ── */
.screen { display: none; width: 100%; min-height: 100vh; }
.screen.active { display: flex; }

/* ============================================================
   LOGIN SCREEN
   ============================================================ */
#screen-login {
  align-items: center; justify-content: center;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(100,180,255,0.08) 0%, transparent 70%), var(--bg);
  flex-direction: column;
}
.login-bg-orb {
  position: fixed; border-radius: 50%; filter: blur(120px); pointer-events: none; z-index: 0;
}
.orb1 { width: 600px; height: 400px; background: rgba(80,160,255,0.06); top: -100px; left: -100px; }
.orb2 { width: 500px; height: 400px; background: rgba(120,80,255,0.05); bottom: -100px; right: -50px; }
.login-wrap { position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 20px; }
.brand-header { text-align: center; margin-bottom: 36px; }
.brand-logo-mark {
  width: 64px; height: 64px; border-radius: 18px;
  background: var(--glass2); border: 1px solid var(--border2);
  display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px;
  box-shadow: 0 0 40px var(--accent-glow);
}
.brand-name { font-family: var(--ff); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.03em; }
.brand-name em { color: var(--accent); font-style: normal; }
.brand-tagline { font-size: 0.78rem; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
.login-card {
  background: rgba(255,255,255,0.03); backdrop-filter: blur(40px);
  border: 1px solid var(--border); border-radius: 24px; padding: 36px;
  box-shadow: var(--shadow2), inset 0 1px 0 rgba(255,255,255,0.06);
}
.login-tabs { display: flex; gap: 4px; background: var(--glass); border-radius: 12px; padding: 4px; margin-bottom: 28px; }
.ltab {
  flex: 1; padding: 9px; text-align: center; border-radius: 9px;
  font-size: 0.8rem; font-weight: 600; letter-spacing: 0.03em; cursor: pointer;
  color: var(--text3); transition: all 0.2s;
}
.ltab.active { background: var(--glass3); color: var(--accent); box-shadow: 0 0 16px rgba(107,184,255,0.1); }
.fgroup { margin-bottom: 16px; }
.fgroup label { display: block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); margin-bottom: 7px; }
.finput {
  width: 100%; background: var(--glass2); border: 1px solid var(--border);
  border-radius: var(--r2); padding: 12px 15px; color: var(--text); font-size: 0.88rem;
  outline: none; transition: border-color 0.2s, box-shadow 0.2s;
}
.finput:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent-glow); }
.finput::placeholder { color: var(--text3); }
.finput-error { border-color: var(--red) !important; }
.error-banner { background: var(--red-g); border: 1px solid rgba(255,107,122,0.25); color: var(--red); border-radius: var(--r3); padding: 10px 14px; font-size: 0.8rem; margin-bottom: 14px; display: none; }
.btn-login {
  width: 100%; font-family: var(--ff); font-size: 0.88rem; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase; padding: 14px;
  border-radius: 100px; background: var(--accent); color: #07090f; border: none;
  box-shadow: 0 0 28px var(--accent-glow); transition: all 0.22s; margin-top: 6px;
}
.btn-login:hover { transform: translateY(-2px); box-shadow: 0 0 48px rgba(107,184,255,0.45); }
.demo-row { display: flex; gap: 6px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border); }
.demo-btn {
  flex: 1; padding: 9px 8px; text-align: center;
  background: var(--glass); border: 1px solid var(--border); border-radius: 10px;
  font-size: 0.73rem; font-weight: 600; color: var(--text2); cursor: pointer;
  transition: all 0.2s;
}
.demo-btn:hover { border-color: var(--border2); background: var(--glass2); color: var(--text); }
.demo-label { font-size: 0.62rem; color: var(--text3); margin-bottom: 3px; letter-spacing: 0.06em; text-transform: uppercase; }

/* ============================================================
   DASHBOARD LAYOUT
   ============================================================ */
#screen-dashboard { flex-direction: row; min-height: 100vh; }

/* ── SIDEBAR ── */
.sidebar {
  width: var(--nav-w); flex-shrink: 0; height: 100vh; position: fixed; top: 0; left: 0; z-index: 60;
  background: rgba(7,9,15,0.92); backdrop-filter: blur(32px);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  transition: transform 0.3s;
}
.sb-logo { padding: 20px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
.sb-logo-mark {
  width: 34px; height: 34px; border-radius: 10px; background: var(--glass3);
  border: 1px solid var(--border2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.sb-brand { font-family: var(--ff); font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
.sb-brand em { color: var(--accent); font-style: normal; }
.sb-role-badge { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 100px; margin-top: 1px; }
.role-admin { background: var(--red-g); color: var(--red); border: 1px solid rgba(255,107,122,0.2); }
.role-employee { background: var(--purple-g); color: var(--purple); border: 1px solid rgba(196,181,253,0.2); }
.role-client { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(107,184,255,0.2); }
.sb-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
.nav-section { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text3); padding: 12px 10px 5px; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--r3);
  cursor: pointer; color: var(--text2); font-size: 0.84rem; font-weight: 500;
  transition: all 0.18s; margin-bottom: 1px; user-select: none; position: relative;
}
.nav-item:hover { background: var(--glass2); color: var(--text); }
.nav-item.active { background: rgba(107,184,255,0.1); color: var(--accent); }
.nav-item .ni-icon { width: 18px; text-align: center; font-size: 0.9rem; flex-shrink: 0; }
.nav-item .ni-badge {
  margin-left: auto; font-size: 0.62rem; font-weight: 700; padding: 1px 6px;
  border-radius: 100px; background: var(--red-g); color: var(--red); min-width: 18px; text-align: center;
}
.ni-badge.info { background: var(--accent-glow); color: var(--accent); }
.sb-user { padding: 14px 16px; border-top: 1px solid var(--border); }
.sb-user-row { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-family: var(--ff); font-size: 0.75rem; font-weight: 700; flex-shrink: 0;
}
.av-blue { background: rgba(107,184,255,0.15); color: var(--accent); border: 1px solid rgba(107,184,255,0.25); }
.av-green { background: rgba(95,255,192,0.12); color: var(--green); border: 1px solid rgba(95,255,192,0.2); }
.av-orange { background: rgba(255,179,71,0.12); color: var(--orange); border: 1px solid rgba(255,179,71,0.2); }
.av-red { background: rgba(255,107,122,0.12); color: var(--red); border: 1px solid rgba(255,107,122,0.2); }
.av-purple { background: rgba(196,181,253,0.12); color: var(--purple); border: 1px solid rgba(196,181,253,0.2); }
.av-gold { background: rgba(255,209,102,0.12); color: var(--gold); border: 1px solid rgba(255,209,102,0.2); }
.av-lg { width: 42px; height: 42px; font-size: 0.9rem; border-radius: 12px; }
.sb-uname { font-size: 0.82rem; font-weight: 600; }
.sb-uemail { font-size: 0.7rem; color: var(--text3); }
.sb-logout { margin-left: auto; font-size: 0.75rem; color: var(--text3); cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.2s; }
.sb-logout:hover { color: var(--red); background: var(--red-g); }

/* ── MAIN AREA ── */
.main-area { margin-left: var(--nav-w); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  height: var(--top-h); border-bottom: 1px solid var(--border); display: flex; align-items: center;
  justify-content: space-between; padding: 0 24px; position: sticky; top: 0; z-index: 50;
  background: rgba(7,9,15,0.85); backdrop-filter: blur(24px);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-title { font-family: var(--ff); font-size: 0.95rem; font-weight: 700; }
.topbar-right { display: flex; align-items: center; gap: 8px; }
.page-content { padding: 24px; flex: 1; }
.page-view { display: none; }
.page-view.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   COMPONENTS
   ============================================================ */

/* ── BUTTONS ── */
.btn { font-family: var(--fb); font-size: 0.8rem; font-weight: 600; letter-spacing: 0.03em; padding: 8px 16px; border-radius: 100px; cursor: pointer; transition: all 0.18s; border: none; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--accent); color: #07090f; box-shadow: 0 0 20px var(--accent-glow); }
.btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 36px rgba(107,184,255,0.45); }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text2); }
.btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--glass); }
.btn-green { background: var(--green-g); border: 1px solid rgba(95,255,192,0.25); color: var(--green); }
.btn-green:hover { background: rgba(95,255,192,0.2); }
.btn-red { background: var(--red-g); border: 1px solid rgba(255,107,122,0.25); color: var(--red); }
.btn-red:hover { background: rgba(255,107,122,0.2); }
.btn-orange { background: var(--orange-g); border: 1px solid rgba(255,179,71,0.25); color: var(--orange); }
.btn-sm { padding: 6px 12px; font-size: 0.74rem; }
.btn-xs { padding: 4px 9px; font-size: 0.68rem; }

/* ── CARDS ── */
.card {
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--r);
  padding: 20px; transition: border-color 0.2s;
}
.card:hover { border-color: var(--border2); }
.card-title { font-family: var(--ff); font-size: 0.92rem; font-weight: 700; margin-bottom: 3px; }
.card-sub { font-size: 0.76rem; color: var(--text2); margin-bottom: 16px; }

/* ── PILLS / BADGES ── */
.pill { font-size: 0.63rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 3px 9px; border-radius: 100px; white-space: nowrap; }
.pill-green { background: var(--green-g); color: var(--green); }
.pill-orange { background: var(--orange-g); color: var(--orange); }
.pill-red { background: var(--red-g); color: var(--red); }
.pill-blue { background: var(--accent-glow); color: var(--accent); }
.pill-purple { background: var(--purple-g); color: var(--purple); }
.pill-gray { background: var(--glass2); color: var(--text2); }

/* ── GRID ── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
.g5 { display: grid; grid-template-columns: repeat(5,1fr); gap: 12px; }
.gc2 { grid-column: span 2; }
.gc3 { grid-column: span 3; }
.mb16 { margin-bottom: 16px; }
.mb24 { margin-bottom: 24px; }

/* ── STATS ── */
.stat-card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
.stat-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); margin-bottom: 8px; }
.stat-val { font-family: var(--ff); font-size: 1.9rem; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
.stat-change { font-size: 0.72rem; margin-top: 5px; display: flex; align-items: center; gap: 4px; }
.stat-change.up { color: var(--green); }
.stat-change.down { color: var(--red); }
.stat-change.neutral { color: var(--text2); }

/* ── TABLE ── */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text3); padding: 9px 13px; text-align: left; border-bottom: 1px solid var(--border); }
.data-table td { padding: 11px 13px; font-size: 0.83rem; border-bottom: 1px solid rgba(255,255,255,0.03); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: rgba(255,255,255,0.015); }

/* ── PROGRESS ── */
.prog-bar { background: rgba(255,255,255,0.06); border-radius: 100px; height: 4px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 100px; background: linear-gradient(to right, var(--accent2), var(--accent)); }
.prog-fill-green { background: linear-gradient(to right, #2dd4a0, var(--green)); }

/* ── FORM ── */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fg { display: flex; flex-direction: column; gap: 7px; }
.fg.full { grid-column: 1/-1; }
.fg label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); }
.fi {
  background: var(--glass2); border: 1px solid var(--border); border-radius: var(--r2);
  padding: 11px 14px; color: var(--text); font-size: 0.86rem; outline: none; width: 100%;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.fi:focus { border-color: var(--accent2); box-shadow: 0 0 0 3px var(--accent-glow); }
.fi::placeholder { color: var(--text3); }
.fi option { background: #0f1220; }
textarea.fi { min-height: 90px; resize: vertical; }

/* ── CHIPS ── */
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { padding: 6px 14px; border-radius: 100px; font-size: 0.76rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); color: var(--text2); transition: all 0.18s; user-select: none; }
.chip:hover { border-color: var(--border2); color: var(--text); }
.chip.on { background: rgba(107,184,255,0.1); border-color: rgba(107,184,255,0.3); color: var(--accent); }

/* ── MODAL ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(16px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal {
  background: #0f1220; border: 1px solid var(--border2); border-radius: 22px;
  padding: 32px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 40px 120px rgba(0,0,0,0.8);
  animation: modalIn 0.25s cubic-bezier(0.16,1,0.3,1);
}
.modal.wide { max-width: 800px; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.modal-title { font-family: var(--ff); font-size: 1.15rem; font-weight: 800; margin-bottom: 4px; }
.modal-sub { font-size: 0.78rem; color: var(--text2); margin-bottom: 24px; }
.modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }

/* ── TIMELINE ── */
.timeline { display: flex; flex-direction: column; }
.tl-item { display: flex; gap: 14px; padding-bottom: 18px; position: relative; }
.tl-item:not(:last-child)::before { content: ''; position: absolute; left: 14px; top: 30px; bottom: 0; width: 1px; background: var(--border); }
.tl-dot { width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; border: 1px solid var(--border); }
.tl-done { background: var(--green-g); border-color: rgba(95,255,192,0.3); color: var(--green); }
.tl-active { background: var(--accent-glow); border-color: rgba(107,184,255,0.3); color: var(--accent); }
.tl-pending { background: var(--glass); }
.tl-body { flex: 1; }
.tl-title { font-size: 0.84rem; font-weight: 600; margin-bottom: 2px; }
.tl-sub { font-size: 0.72rem; color: var(--text2); }

/* ── DELIVERABLE CARDS ── */
.del-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.del-card {
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--r2);
  overflow: hidden; cursor: pointer; transition: all 0.25s;
}
.del-card:hover { border-color: var(--border2); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
.del-thumb {
  aspect-ratio: 16/9; background: var(--glass2); display: flex; align-items: center;
  justify-content: center; font-size: 1.8rem; position: relative; overflow: hidden;
}
.del-status-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; }
.dot-green { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot-orange { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
.del-info { padding: 12px; }
.del-name { font-size: 0.82rem; font-weight: 600; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.del-meta { font-size: 0.7rem; color: var(--text2); display: flex; justify-content: space-between; }

/* ── COMMENT THREAD ── */
.comment-thread { display: flex; flex-direction: column; gap: 10px; }
.comment { display: flex; gap: 10px; }
.comment-body { flex: 1; background: var(--glass2); border-radius: 0 12px 12px 12px; padding: 10px 13px; }
.comment.self .comment-body { border-radius: 12px 0 12px 12px; background: rgba(107,184,255,0.07); }
.comment-author { font-size: 0.72rem; font-weight: 700; margin-bottom: 3px; }
.comment-text { font-size: 0.82rem; line-height: 1.5; color: var(--text2); }
.comment-time { font-size: 0.66rem; color: var(--text3); margin-top: 4px; }

/* ── AI RESULT CARDS ── */
.ai-option { border: 1px solid var(--border); border-radius: var(--r2); padding: 18px; position: relative; cursor: pointer; transition: all 0.2s; }
.ai-option:hover { border-color: var(--border2); }
.ai-option.recommended { border-color: rgba(107,184,255,0.3); background: rgba(107,184,255,0.04); }
.ai-opt-rec-badge { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; font-weight: 700; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 100px; background: var(--accent); color: #07090f; white-space: nowrap; }
.ai-opt-name { font-family: var(--ff); font-size: 0.88rem; font-weight: 700; margin-bottom: 5px; }
.ai-opt-price { font-family: var(--ff); font-size: 1.5rem; font-weight: 800; color: var(--accent); letter-spacing: -0.04em; margin-bottom: 10px; }
.ai-opt-items { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.ai-opt-items li { font-size: 0.76rem; color: var(--text2); display: flex; align-items: flex-start; gap: 5px; }
.ai-opt-items li::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; margin-top: 1px; }

/* ── ANALYTICS CHART BARS ── */
.bar-chart { display: flex; flex-direction: column; gap: 11px; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-lbl { font-size: 0.75rem; color: var(--text2); width: 70px; flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: var(--glass2); border-radius: 100px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 100px; background: linear-gradient(to right, var(--accent2), var(--accent)); transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
.bar-val { font-size: 0.75rem; font-weight: 600; width: 55px; text-align: right; flex-shrink: 0; }

/* ── ACTIVITY FEED ── */
.act-feed { display: flex; flex-direction: column; gap: 8px; }
.act-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px; background: var(--glass); border-radius: var(--r3); }
.act-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; flex-shrink: 0; }
.act-text { font-size: 0.8rem; line-height: 1.4; }
.act-time { font-size: 0.67rem; color: var(--text3); margin-top: 1px; }

/* ── EMPLOYEE CARDS ── */
.emp-card {
  background: var(--glass); border: 1px solid var(--border); border-radius: var(--r);
  padding: 18px; cursor: pointer; transition: all 0.22s;
}
.emp-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.emp-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.emp-name { font-size: 0.88rem; font-weight: 700; }
.emp-role { font-size: 0.7rem; color: var(--text2); margin-top: 1px; }
.emp-role-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
.emp-role-tag { font-size: 0.62rem; font-weight: 600; padding: 2px 7px; border-radius: 100px; background: var(--glass2); border: 1px solid var(--border); color: var(--text2); }
.emp-stats { display: flex; gap: 0; border-top: 1px solid var(--border); padding-top: 12px; }
.emp-stat { flex: 1; text-align: center; }
.emp-stat:not(:last-child) { border-right: 1px solid var(--border); }
.emp-stat-val { font-family: var(--ff); font-size: 1.1rem; font-weight: 700; }
.emp-stat-lbl { font-size: 0.62rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 1px; }

/* ── CONTRACT CARDS ── */
.contract-item { display: flex; align-items: center; gap: 13px; padding: 14px 16px; background: var(--glass); border: 1px solid var(--border); border-radius: var(--r2); cursor: pointer; transition: all 0.2s; }
.contract-item:hover { border-color: var(--border2); background: var(--glass2); }
.ci-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }

/* ── NOTIFICATION TOAST ── */
#toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast {
  background: #0f1220; border: 1px solid var(--border2); border-radius: 14px; padding: 14px 18px;
  min-width: 280px; max-width: 380px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  animation: toastIn 0.3s cubic-bezier(0.16,1,0.3,1); pointer-events: auto;
  display: flex; align-items: flex-start; gap: 10px;
}
@keyframes toastIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
.toast-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
.toast-title { font-size: 0.82rem; font-weight: 700; margin-bottom: 2px; }
.toast-msg { font-size: 0.76rem; color: var(--text2); }
.toast.success .toast-icon { background: var(--green-g); }
.toast.error .toast-icon { background: var(--red-g); }
.toast.info .toast-icon { background: var(--accent-glow); }

/* ── LOADING SPINNER ── */
.spinner { width: 18px; height: 18px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-row { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 0.84rem; padding: 16px; }

/* ── ANALYTICS SPECIFIC ── */
.metric-card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; }
.metric-platform { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.metric-number { font-family: var(--ff); font-size: 1.6rem; font-weight: 800; letter-spacing: -0.04em; }
.metric-change { font-size: 0.72rem; margin-top: 4px; }
.metric-change.up { color: var(--green); }
.metric-change.down { color: var(--red); }
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; box-shadow: 0 0 0 0 rgba(95,255,192,0.5); } 50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(95,255,192,0); } }

/* ── WELCOME BANNER ── */
.welcome-banner {
  background: linear-gradient(135deg, rgba(107,184,255,0.07) 0%, rgba(80,100,255,0.04) 100%);

}
.wb-title { font-family: var(--ff); font-size: 1.25rem; font-weight: 800; margin-bottom: 4px; }
.wb-sub { font-size: 0.82rem; color: var(--text2); }
</style>

  const err = document.getElementById('login-error');
  err.style.display = 'none';
  const match = Object.values(DEMO_USERS).find(u => u.email === email && u.pw === pw);
  if (!match) { err.style.display = 'block'; err.textContent = 'Ungültige Zugangsdaten.'; return; }
  STATE.user = match;
  localStorage.setItem('yb_session', JSON.stringify(match));
  initDashboard();
}
function logout() {
  STATE.user = null; localStorage.removeItem('yb_session');
  document.getElementById('screen-dashboard').classList.remove('active');
  document.getElementById('screen-login').classList.add('active');
}

function openModal(type) {
  const box = document.getElementById('modal-box');
  const content = document.getElementById('modal-content');
  box.className = 'modal';

  const modals = {
    'new-employee': buildNewEmployeeModal,
    'new-task': buildNewTaskModal,
    'new-deliverable': buildNewDeliverableModal,
    'new-client': buildNewClientModal,
  };

  if (modals[type]) {
    content.innerHTML = modals[type]();
    document.getElementById('modal-overlay').classList.add('open');
  }
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay')) {
    document.getElementById('modal-overlay').classList.remove('open');
  }
}

async function runAIQuote() {
  const problem = document.getElementById('r-problem')?.value || '';
  const vision = document.getElementById('r-vision')?.value || '';
  const budget = document.getElementById('r-budget')?.value || '';
  const services = Array.from(document.querySelectorAll('#service-chips .chip.on')).map(c => c.textContent.trim());
  const url = document.getElementById('r-url')?.value || '';
  const ref = document.getElementById('r-ref')?.value || '';

  if (!problem && !vision) { toast('error', 'Fehlende Angaben', 'Bitte beschreibe dein Vorhaben.'); return; }

  const loading = document.getElementById('ai-loading');
  const result = document.getElementById('ai-quote-result');
  if (loading) loading.style.display = 'flex';
  if (result) result.style.display = 'none';

  const prompt = `Du bist ein erfahrener Medienproduktions-Berater für eine professionelle Foto & Video Agentur. Analysiere diese Kundenanfrage und erstelle drei konkrete Angebotsoptionen.

Kundeninfo:
- Website: ${url || 'Nicht angegeben'}
- Referenzkanäle: ${ref || 'Nicht angegeben'}
- Gewünschte Services: ${services.join(', ') || 'Nicht spezifiziert'}
- Problem/Vorhaben: ${problem}
- Lösungsvorstellung: ${vision || 'Nicht angegeben'}
- Budget: ${budget || 'Nicht angegeben'}

Antworte NUR mit einem JSON-Objekt (kein Markdown, keine Backticks):
{"analysis":"2-3 Sätze Analyse und Empfehlung","options":[{"name":"Basic","price":"€ X.XXX","items":["Leistung 1","Leistung 2","Leistung 3"],"recommended":false},{"name":"Standard","price":"€ X.XXX","items":["Leistung 1","Leistung 2","Leistung 3","Leistung 4"],"recommended":true},{"name":"Premium","price":"€ X.XXX","items":["Leistung 1","Leistung 2","Leistung 3","Leistung 4","Leistung 5"],"recommended":false}]}`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, messages: [{ role: 'user', content: prompt }] })
    });
    const data = await res.json();
    let txt = data.content.map(b => b.text || '').join('').trim();
    const m = txt.match(/\{[\s\S]*\}/);
    const parsed = JSON.parse(m ? m[0] : txt);

    if (loading) loading.style.display = 'none';
    if (result) {
      result.style.display = 'block';
      result.innerHTML = `
        <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:22px">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
            <div style="font-family:var(--ff);font-size:0.95rem;font-weight:700">🤖 KI-Analyse</div>
            <span class="pill pill-orange">Vorläufig – Bestätigung durch Team erforderlich</span>
          </div>
          <p style="font-size:0.84rem;color:var(--text2);line-height:1.65;margin-bottom:20px">${parsed.analysis}</p>
          <div class="g3 mb24">
            ${parsed.options.map(opt=>`
              <div class="ai-option ${opt.recommended?'recommended':''}">
                ${opt.recommended?'<div class="ai-opt-rec-badge">⭐ Empfohlen</div>':''}
                <div class="ai-opt-name">${opt.name}</div>
                <div class="ai-opt-price">${opt.price}</div>
                <ul class="ai-opt-items">${opt.items.map(i=>`<li>${i}</li>`).join('')}</ul>
              </div>`).join('')}
          </div>
          <div style="padding:12px 14px;background:rgba(255,179,71,0.05);border:1px solid rgba(255,179,71,0.15);border-radius:var(--r2);font-size:0.78rem;color:var(--text2);margin-bottom:16px">
            ⚠️ Dieses Angebot ist <strong>vorläufig</strong> und wird erst nach Prüfung und Bestätigung durch unser Team gültig. Du wirst benachrichtigt.
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="submitQuoteRequest()">Anfrage absenden →</button>
        </div>`;
    }
  } catch (e) {
    if (loading) loading.style.display = 'none';
    toast('error', 'KI-Fehler', 'Analyse fehlgeschlagen. Bitte erneut versuchen.');
  }
}

function submitQuoteRequest() {
  const result = document.getElementById('ai-quote-result');
  if (result) result.innerHTML = `
    <div style="margin-top:24px;border-top:1px solid var(--border);padding-top:22px;text-align:center">
      <div style="font-size:2.5rem;margin-bottom:12px">✓</div>
      <div style="font-family:var(--ff);font-size:1rem;font-weight:700;color:var(--green);margin-bottom:8px">Anfrage erfolgreich eingereicht!</div>
      <p style="font-size:0.82rem;color:var(--text2)">Unser Team prüft dein Angebot und meldet sich innerhalb von 24h. Bei Bestätigung erhältst du automatisch das offizielle PDF und einen Vertragsentwurf auf deinem Dashboard.</p>
    </div>`;
  toast('success', 'Anfrage eingereicht', 'Wir melden uns innerhalb von 24h!');
}

// ============================================================
// ACTIONS
// ============================================================
function saveNewEmployee() {
  const fn = document.getElementById('em-fn')?.value?.trim();
  const ln = document.getElementById('em-ln')?.value?.trim();
  const email = document.getElementById('em-email')?.value?.trim();
  const rate = parseInt(document.getElementById('em-rate')?.value) || 75;
  const roles = Array.from(document.querySelectorAll('#role-chips .chip.on')).map(c => c.textContent.trim().replace(/^[^\w]+/, '').trim());

  if (!fn || !roles.length) { toast('error', 'Fehler', 'Name und mindestens eine Rolle sind erforderlich.'); return; }

  const colors = ['av-blue','av-green','av-orange','av-red','av-purple','av-gold'];
  const newEmp = {
    id: 'e' + Date.now(), name: `${fn} ${ln}`, email: email || `${fn.toLowerCase()}@yourbrand.com`,
    initials: (fn[0] + (ln?ln[0]:'')).toUpperCase(),
    avClass: colors[Math.floor(Math.random() * colors.length)],
    roles: roles.slice(0, 5), rate, tasks: 0, projects: 0, active: true
  };
  STATE.employees.push(newEmp);
  closeModal();
  navigateTo('employees');
  toast('success', 'Mitarbeiter angelegt', `${fn} ${ln} wurde erfolgreich hinzugefügt.`);
}

function saveNewTask() {
  const title = document.getElementById('nt-title')?.value?.trim();
  const empId = document.getElementById('nt-emp')?.value;
  const emp = STATE.employees.find(e => e.id === empId);
  const client = document.getElementById('nt-client')?.value;
  const project = document.getElementById('nt-proj')?.value;
  const due = document.getElementById('nt-due')?.value || '—';
  const prio = document.getElementById('nt-prio')?.value || 'medium';

  if (!title) { toast('error', 'Fehler', 'Bitte Aufgabentitel eingeben.'); return; }

  STATE.tasks.push({ id: 't' + Date.now(), title, employee: emp?.name || '—', project, priority: prio, due, status: 'open', client });
  if (emp) emp.tasks++;
  closeModal();
  navigateTo('tasks-admin');
  toast('success', 'Aufgabe zugewiesen', `"${title}" wurde ${emp?.name} zugewiesen.`);
}

function saveNewDeliverable() {
  const name = document.getElementById('nd-name')?.value?.trim();
  const client = document.getElementById('nd-client')?.value;
  const type = document.getElementById('nd-type')?.value || 'video';
  const project = document.getElementById('nd-proj')?.value;
  const url = document.getElementById('nd-url')?.value || '#';
  const status = document.getElementById('nd-status')?.value || 'draft';
  const version = parseInt(document.getElementById('nd-ver')?.value) || 1;
  const comment = document.getElementById('nd-comment')?.value?.trim();

  if (!name) { toast('error', 'Fehler', 'Bitte Dateiname eingeben.'); return; }

  const emojiMap = { video:'🎬', photo:'📸', graphic:'🎨', web:'🌐', doc:'📄' };
  STATE.deliverables.push({
    id: 'd' + Date.now(), name, type, emoji: emojiMap[type] || '📄', project, client, url,
    date: new Date().toLocaleDateString('de-DE', { day:'numeric', month:'short', year:'numeric' }),
    status, version,
    comments: comment ? [{ author: STATE.user?.name || 'Admin', text: comment, time: 'Soeben', self: true }] : []
  });
  closeModal();
  navigateTo('deliverables-admin');
  toast('success', 'Deliverable hinzugefügt', `"${name}" für ${client} ist jetzt verfügbar.`);
}

function saveNewClient() {
  const name = document.getElementById('nc-name')?.value?.trim();
  const email = document.getElementById('nc-email')?.value?.trim();
  const co = document.getElementById('nc-co')?.value?.trim();
  if (!name) { toast('error', 'Fehler', 'Name erforderlich.'); return; }
  STATE.clients.push({ id: 'c' + Date.now(), name, email: email || '', company: co || name, revenue: 0, projects: 0, status: 'new' });
  closeModal();
  navigateTo('clients');
  toast('success', 'Kunde angelegt', `${name} wurde hinzugefügt.`);
}

function confirmOffer(id) {
  const o = STATE.offers.find(x => x.id === id);
  if (o) o.status = 'confirmed';
  const price = document.getElementById('conf-price')?.value;
  if (price && o) o.price = '€' + price;
  closeModal();
  toast('success', 'Angebot bestätigt!', 'PDF-Angebot + Vertrag wurde an den Kunden gesendet.');
  navigateTo('offers');
}

function rejectOffer(id) {
  const o = STATE.offers.find(x => x.id === id);
  if (o) o.status = 'rejected';
  closeModal();
  toast('info', 'Angebot abgelehnt', 'Kunde wird benachrichtigt.');
  navigateTo('offers');
}

function toggleOfferDetails(id) {
  const el = document.getElementById(id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function addComment(delId) {
  const d = STATE.deliverables.find(x => x.id === delId);
  const input = document.getElementById(`new-comment-${delId}`);
  if (!d || !input?.value?.trim()) return;
  const comment = { author: STATE.user?.name || 'User', text: input.value.trim(), time: 'Soeben', self: STATE.user?.role !== 'client' };
  d.comments.push(comment);
  const thread = document.getElementById(`comment-thread-${delId}`);
  if (thread) {
    const div = document.createElement('div');
    div.className = `comment ${comment.self ? 'self' : ''}`;
    div.innerHTML = `<div class="avatar ${comment.self?'av-green':'av-blue'}" style="font-size:0.68rem;width:28px;height:28px;flex-shrink:0">${comment.author.split(' ').map(n=>n[0]).join('').slice(0,2)}</div><div class="comment-body"><div class="comment-author">${comment.author}</div><div class="comment-text">${comment.text}</div><div class="comment-time">${comment.time}</div></div>`;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }
  input.value = '';
  toast('success', 'Kommentar gespeichert', '');
}

function updateDeliverableVersion(id) {
  toast('info', 'Neue Version', 'Füge einen neuen Deliverable über "+Deliverable" hinzu und setze die Versionsnummer entsprechend.');
}

function markTaskDone(id) {
  const t = STATE.tasks.find(x => x.id === id);
  if (t) t.status = 'done';
  navigateTo('my-tasks');
  toast('success', 'Aufgabe erledigt', `"${t?.title}" als erledigt markiert.`);
}

function loadConversation(name) {
  const area = document.getElementById('chat-area');
  if (area) area.innerHTML = buildChatView(name);
}

function sendMsg(name) {
  const input = document.getElementById('chat-input');
  if (!input?.value?.trim()) return;
  if (!STATE.messages[name]) STATE.messages[name] = [];
  STATE.messages[name].push({ from: STATE.user?.name || 'User', text: input.value.trim(), time: 'Gerade eben', self: true });
  loadConversation(name);
}

function toggleRoleChip(el) {
  const selected = document.querySelectorAll('#role-chips .chip.on').length;
  if (!el.classList.contains('on') && selected >= 5) { toast('info', 'Max. 5 Rollen', 'Du kannst maximal 5 Rollen zuweisen.'); return; }
  el.classList.toggle('on');
}

function filterDels(btn, type) {
  document.querySelectorAll('#del-client-grid .del-card').forEach(c => {
    c.style.display = (type === 'all' || c.dataset.type === type) ? 'block' : 'none';
  });
  btn.closest('.page-view').querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  btn.classList.add('on');
}

  const map = { production:'<span class="pill pill-blue">Produktion</span>', review:'<span class="pill pill-orange">Review</span>', planning:'<span class="pill pill-gray">Planung</span>', done:'<span class="pill pill-green">Fertig</span>' };
  return map[s] || `<span class="pill pill-gray">${s}</span>`;
}

  const map = { pending:'<span class="pill pill-orange">Ausstehend</span>', confirmed:'<span class="pill pill-green">Bestätigt</span>', rejected:'<span class="pill pill-gray">Abgelehnt</span>' };
  return map[s] || `<span class="pill pill-gray">${s}</span>`;
}
function pillStatus3(s) {
  const map = { active:'<span class="pill pill-green">Aktiv</span>', done:'<span class="pill pill-blue">Abgeschlossen</span>', negotiation:'<span class="pill pill-orange">Verhandlung</span>', new:'<span class="pill pill-gray">Neu</span>' };

}
function pillTaskStatus(s) {
  const map = { 'in-progress':'<span class="pill pill-blue">In Arbeit</span>', open:'<span class="pill pill-orange">Offen</span>', done:'<span class="pill pill-green">Erledigt</span>' };
  return map[s] || `<span class="pill pill-gray">${s}</span>`;
}
function pillDelStatus(s) {
  const map = { draft:'<span class="pill pill-gray">Entwurf</span>', review:'<span class="pill pill-orange">Review</span>', delivered:'<span class="pill pill-green">Übergeben</span>', live:'<span class="pill pill-blue">Live</span>' };
  return map[s] || `<span class="pill pill-gray">${s}</span>`;
}
function delTypePill(t) {
  const map = { video:'pill-blue', photo:'pill-green', graphic:'pill-purple', web:'pill-orange', doc:'pill-gray' };
  return map[t] || 'pill-gray';
}
function delBg(t) {
  const map = { video:'rgba(107,184,255,0.1),rgba(60,110,255,0.04)', photo:'rgba(95,255,192,0.08),rgba(50,200,150,0.03)', graphic:'rgba(196,181,253,0.1),rgba(150,80,255,0.04)', web:'rgba(255,179,71,0.08),rgba(255,120,50,0.03)', doc:'rgba(255,255,255,0.06),rgba(255,255,255,0.02)' };
  return map[t] || 'rgba(255,255,255,0.06),rgba(255,255,255,0.02)';
}

// ============================================================
// TOAST SYSTEM
// ============================================================
function toast(type, title, msg) {
  const icons = { success:'✓', error:'✕', info:'ℹ' };
  const colors = { success:'var(--green)', error:'var(--red)', info:'var(--accent)' };
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.innerHTML = `<div class="toast-icon" style="color:${colors[type]}">${icons[type]}</div><div><div class="toast-title">${title}</div>${msg?`<div class="toast-msg">${msg}</div>`:''}</div>`;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.style.opacity = '0', 3500);
  setTimeout(() => t.remove(), 4000);
  t.style.transition = 'opacity 0.5s';
}

// ============================================================
// INIT
// ============================================================
const saved = localStorage.getItem('yb_session');
if (saved) {
  try {
    STATE.user = JSON.parse(saved);
    initDashboard();
  } catch (e) { localStorage.removeItem('yb_session'); }
}
